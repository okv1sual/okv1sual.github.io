  <!-- Inline so the coming-soon typewriter cannot 404 or lose a race to a
       cached copy of animations.js. coming-soon.js is kept as the same
       isolated source for later deletion. -->
  <script>
    window.okv1sualHeroConfig = {
      deferSocials: true,
      startTypewriter: function (typewriterEl, onComplete) {
        if (!typewriterEl) {
          if (onComplete) onComplete();
          return;
        }
        var textPrefix = "coming ";
        var highlightWord = "soon";
        var charIndex = 0;
        var totalLen = textPrefix.length + highlightWord.length;

        function typeChar() {
          if (charIndex < totalLen) {
            charIndex++;
            var currentText = (textPrefix + highlightWord).substring(0, charIndex);

            if (currentText.length > textPrefix.length) {
              var typedHighlight = currentText.substring(textPrefix.length);
              typewriterEl.innerHTML = textPrefix + '<span class="highlight-yellow">' + typedHighlight + '</span><span class="cursor-bar">|</span>';
            } else {
              typewriterEl.innerHTML = currentText + '<span class="cursor-bar">|</span>';
            }

            setTimeout(typeChar, 85);
          } else {
            typewriterEl.innerHTML = 'coming <span class="highlight-yellow">soon</span>';
            if (onComplete) onComplete();
          }
        }
        typeChar();
      }
    };
  </script>
